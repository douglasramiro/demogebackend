micronaut:
  application:
    name: orderhub
  server:
    port: ${PORT:8080}
    thread-selection: AUTO
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
